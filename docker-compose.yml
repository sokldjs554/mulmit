# Local stack: PostgreSQL+pgvector, Redis, Mailpit (SMTP catcher), API, worker, web.
#
#   docker compose up -d --build          # http://localhost:3000 (web), :8000/docs (API), :8025 (mail)
#   docker compose run --rm api manage seed && docker compose run --rm api manage demo run
#
# Everything runs offline by default: heuristic extractor instead of the LLM, hashing embedder,
# fake payment provider, synthetic fixture sources. Put real keys in .env to switch them on.

x-api-env: &api-env
  APP_ENV: local
  APP_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
  APP_REDIS_URL: redis://redis:6379/0
  APP_STORAGE_URL: file:///app/.data/raw
  APP_SMTP_HOST: mailpit
  APP_SMTP_PORT: "1025"
  APP_PUBLIC_WEB_URL: http://localhost:3000
  APP_LOG_JSON: "false"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  migrate:
    build: ./apps/api
    image: app-api:local
    command: ["manage", "db", "upgrade"]
    environment: *api-env
    env_file: [{path: .env, required: false}]
    depends_on:
      db: {condition: service_healthy}

  api:
    image: app-api:local
    environment: *api-env
    env_file: [{path: .env, required: false}]
    ports: ["8000:8000"]
    volumes: [rawdata:/app/.data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    image: app-api:local
    command: ["manage", "worker"]
    environment:
      <<: *api-env
      PORT: "8001" # /healthz for the image's HEALTHCHECK; not published
    env_file: [{path: .env, required: false}]
    volumes: [rawdata:/app/.data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    build: ./apps/web
    environment:
      API_ORIGIN: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  rawdata:
