name: Deploy (Cloud Run)

# Terraform (infra/terraform) owns the services' configuration — env, secrets, scaling, VPC.
# This workflow only ships new images: build → push to Artifact Registry → migrate → roll out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation; no service-account keys in GitHub

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
  REGISTRY: ${{ vars.GCP_REGION || 'asia-northeast3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/images

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ github.sha }}
          build-args: NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Run migrations (Cloud Run job) before any service sees the new code
        run: |
          gcloud run jobs update app-migrate --region "$REGION" --image "$REGISTRY/api:$GITHUB_SHA" \
            --command manage --args db,upgrade
          gcloud run jobs execute app-migrate --region "$REGION" --wait
      - name: Roll out worker, API and web
        run: |
          gcloud run deploy app-worker --region "$REGION" --image "$REGISTRY/api:$GITHUB_SHA" \
            --command manage --args worker
          gcloud run deploy app-api --region "$REGION" --image "$REGISTRY/api:$GITHUB_SHA"
          gcloud run deploy app-web --region "$REGION" --image "$REGISTRY/web:$GITHUB_SHA"
      - name: Smoke test through the public web service (the API itself is internal-only)
        run: |
          url=$(gcloud run services describe app-web --region "$REGION" --format 'value(status.url)')
          curl -fsS -o /dev/null "$url/login"
          # 401 (not 502/504) proves the web → internal API route works without credentials
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/me")" = "401"
