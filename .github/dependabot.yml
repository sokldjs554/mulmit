version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
    groups: {web: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
